    Användning: <svg width="16" height="16" aria-hidden="true"><use href="../../system/ikoner.svg#ik-arrow-right"/></svg>
    Kräver att sidan serveras över http (extern <use> blockeras på file:// i Chromium).
    Källor: pilen = cta-website offert-cta.html (16-rutnät M4.7 11.3 11.3 4.7 ... skalad x1.5), luren = ring-cta.html (lur med två ljudbågar),
    bocken = elcentral-kollen __check, chevron = eljour-block __chev, i-ikonen = elcentral info-ruta, varning = eljour __safety.
  -->
