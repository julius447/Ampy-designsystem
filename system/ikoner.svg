<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    Ampy designsystem: ikonsprite (S2). EN familj för alla exempel.
    24-rutnät, stroke 1.75, runda ändar och hörn, fill none, stroke currentColor.
